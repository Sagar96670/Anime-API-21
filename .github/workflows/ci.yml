name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Syntax check
        shell: bash
        run: |
          set -e
          while IFS= read -r file; do
            node --check "$file"
          done < <(find . -type f -name "*.js" -not -path "./node_modules/*" -not -path "./.git/*")

      - name: Build Docker image
        run: docker build -t anime-api-21:ci .
